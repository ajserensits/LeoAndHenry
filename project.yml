name: HenrysGardenChase
options:
  xcodeVersion: "15.4"
  objectVersion: 56
  bundleIdPrefix: com.sproutandsmiles
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HenrysGardenChase:
    type: application
    platform: iOS
    sources:
      - path: SproutAndSmiles
        excludes:
          - Resources.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sproutandsmiles.garden
        PRODUCT_NAME: Henry's Garden Chase
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Henry's Chase
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
